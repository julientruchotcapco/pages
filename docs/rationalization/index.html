<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Risk, Finance &amp; Compliance – Application Rationalisation Workbench</title>
<style>
:root{--navy:#0b2545;--navy2:#13315c;--ink:#1f2937;--mut:#6b7280;--line:#e5e7eb;--bg:#f4f6fa;--card:#fff;--hl:#fff4c2}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Inter,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:13px;line-height:1.4}
header{background:var(--navy);color:#fff;padding:8px 18px;display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:60;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.brand b{display:block;font-size:15px;letter-spacing:.02em}.brand span{font-size:11px;color:#9fb3d1}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;flex:1}
nav.tabs button{background:transparent;color:#c8d3e6;border:0;padding:7px 11px;border-radius:6px;cursor:pointer;font:inherit;font-size:12.5px}
nav.tabs button:hover{background:rgba(255,255,255,.08);color:#fff}
nav.tabs button.on{background:#fff;color:var(--navy);font-weight:600}
.demo{font-size:11px;background:#f59e0b;color:#111;padding:3px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
main{padding:16px 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
h1{font-size:21px;margin:0 0 4px;color:var(--navy)}
h2{font-size:17px;margin:0 0 4px;color:var(--navy)}
h3{font-size:14px;margin:0 0 10px;color:var(--navy)}
h4{font-size:12.5px;margin:10px 0 6px;color:var(--navy2)}
.sub{color:var(--mut);margin:0 0 10px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
.g12{grid-template-columns:1.2fr 1fr}.g21{grid-template-columns:2fr 1fr}
@media(max-width:1100px){.g2,.g3,.g4,.g5,.g6,.g12,.g21{grid-template-columns:1fr 1fr}}
.kpi{padding:12px 14px}.kpi .l{color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kpi .v{font-size:22px;font-weight:700;color:var(--navy);margin:3px 0}.kpi .d{font-size:12px;color:#15803d;font-weight:600}.kpi .d.neg{color:#b91c1c}
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:left;font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;border-bottom:2px solid var(--line);padding:6px 6px;background:#fafbfc;position:sticky;top:0}
table.t td{padding:5px 6px;border-bottom:1px solid #f0f2f5;vertical-align:middle}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:#f5f8ff}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;color:#fff;white-space:nowrap}
.dchip{display:inline-block;padding:1px 7px;border-radius:4px;font-size:10.5px;font-weight:600;color:var(--c);border:1px solid var(--c);background:#fff;margin:1px 2px 1px 0;white-space:nowrap}
.achip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:5px;font-size:12px;color:#fff;margin:3px;cursor:pointer;font-weight:500}
.achip small{opacity:.85;font-size:10px}
.achip.gone{opacity:.55;text-decoration:line-through}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
input.in,select.in,textarea.in{border:1px solid #d1d5db;border-radius:5px;padding:4px 6px;font:inherit;font-size:12.5px;width:100%;background:#fff;color:var(--ink)}
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid #93c5fd;border-color:#60a5fa}
input.num{text-align:right}
.btn{background:var(--navy);color:#fff;border:0;border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit;font-size:12.5px;white-space:nowrap}
.btn:hover{background:var(--navy2)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid #cbd5e1}.btn.ghost:hover{background:#f1f5f9}
.btn.danger{background:#fff;color:#dc2626;border:1px solid #fecaca;padding:3px 8px}.btn.danger:hover{background:#fef2f2}
.btn.sm{padding:3px 8px;font-size:11.5px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}
.toolbar label{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:12px}
.toolbar .in{width:auto}
.muted{color:var(--mut)}.small{font-size:11.5px}.b{font-weight:600}
.badge{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:600}
.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:6px;padding:6px 10px;margin:6px 0}
.note{background:#f0f9ff;border:1px solid #bae6fd;color:#075985;border-radius:6px;padding:8px 12px;margin:6px 0}
details>summary{cursor:pointer;color:var(--navy2);font-weight:600;padding:4px 0}
/* scores */
input.sc{width:38px;text-align:center;border:1px solid #d1d5db;border-radius:4px;padding:3px 0;font:inherit;font-weight:600}
.s1{background:#fecaca}.s2{background:#fed7aa}.s3{background:#fef3c7}.s4{background:#d9f99d}.s5{background:#86efac}
.bar{height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%;border-radius:4px}
.hbar{display:grid;grid-template-columns:170px 1fr 54px;gap:8px;align-items:center;margin:3px 0;font-size:12px}
/* matrix */
.mx-wrap{overflow:auto;max-height:76vh;border:1px solid var(--line);border-radius:8px;background:#fff}
table.mx{border-collapse:separate;border-spacing:0;font-size:12px}
table.mx th,table.mx td{border-right:1px solid #eef0f4;border-bottom:1px solid #eef0f4;padding:0}
table.mx thead th{position:sticky;top:0;background:#fff;z-index:3}
table.mx th.vh{height:190px;vertical-align:bottom;width:28px;min-width:28px;max-width:28px;cursor:pointer}
table.mx th.vh div{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-weight:600;margin:4px auto;font-size:11.5px;color:var(--ink)}
table.mx th.vh i{display:block;height:6px}
table.mx .rh{position:sticky;left:0;background:#fff;z-index:2;min-width:340px;max-width:340px;padding:3px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.mx thead th.corner{left:0;z-index:5;vertical-align:bottom;text-align:left;padding:8px}
table.mx td.c{width:28px;height:23px;text-align:center;cursor:pointer;font-size:10.5px;font-weight:700}
table.mx td.lv3{background:#0b2545;color:#fff}table.mx td.lv2{background:#5b7db1;color:#fff}table.mx td.lv1{background:#cfdcf0;color:#334155}
table.mx tr.dom td{background:var(--c);color:#fff;font-weight:700;font-size:12.5px;padding:4px 8px}
table.mx tr.grp td{background:#f1f5f9;font-weight:600;color:var(--navy2);padding:3px 8px}
table.mx tr.grp td.rh{background:#f1f5f9}
table.mx td.cnt{min-width:46px;text-align:center;font-weight:600}
table.mx td.ov{min-width:76px;text-align:center}
table.mx tfoot td{position:sticky;bottom:0;background:#f8fafc;font-weight:700;text-align:center;font-size:11px;z-index:3}
table.mx tfoot td.rh{z-index:4;text-align:left}
table.mx tr.hl td{box-shadow:inset 0 0 0 999px rgba(250,204,21,.22)}
table.mx .hlc{box-shadow:inset 0 0 0 999px rgba(250,204,21,.28)!important}
table.mx td.c.cur{outline:2px solid #f59e0b;outline-offset:-2px}
table.mx th.vh.hlc div{color:#b45309}
.lg{display:inline-flex;align-items:center;gap:5px;margin-right:12px;font-size:11.5px}
.lg i{display:inline-block;width:16px;height:14px;border-radius:3px;font-style:normal;text-align:center;font-size:10px;font-weight:700;color:#fff;line-height:14px}
/* tooltip & modal */
#tip{position:fixed;pointer-events:none;background:#0f172a;color:#fff;padding:7px 10px;border-radius:6px;font-size:11.5px;max-width:340px;z-index:200;display:none;white-space:pre-line;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow:auto}
.modal.hide{display:none}
.mbox{background:#fff;border-radius:12px;max-width:1150px;width:100%;padding:20px 24px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mclose{position:absolute;right:14px;top:10px;border:0;background:transparent;font-size:24px;cursor:pointer;color:var(--mut)}
#dlg{z-index:150;align-items:center}
.mbox.dlg{max-width:480px}.mbox.dlg h3{margin:0 0 8px}.mbox.dlg p{margin:0 0 14px;color:#334155}
.btn.red{background:#dc2626}.btn.red:hover{background:#b91c1c}
#toast{position:fixed;right:20px;bottom:20px;z-index:210;display:none;color:#fff;padding:10px 16px;border-radius:8px;font-size:12.5px;max-width:420px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
/* unsaved (draft) rows */
tr.draft td{background:#fef2f2}
tr.draft:not(.msg) td{border-top:2px solid #dc2626}
tr.draft:not(.msg) td:first-child{box-shadow:inset 4px 0 0 #dc2626}
tr.draft.msg td{color:#991b1b;font-size:11.5px;border-bottom:2px solid #dc2626;padding:4px 8px}
tr.draft.msg td:first-child{box-shadow:inset 4px 0 0 #dc2626}
tr.draft .in.bad{border-color:#dc2626;outline:2px solid #fecaca}
tr.draft .derr{font-weight:700;margin-top:2px}
tr.draft.flash td{animation:flash .9s 2}
@keyframes flash{50%{background:#fecaca}}
/* gantt */
.gantt{display:grid;grid-template-columns:300px repeat(12,1fr);font-size:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.gantt .gh{font-weight:700;color:var(--navy);text-align:center;padding:6px 0;background:#f1f5f9;border-bottom:1px solid var(--line)}
.gantt .gl{padding:4px 10px;border-bottom:1px solid #f1f3f6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt .gl.ph{font-weight:700;color:#fff}
.gantt .gc{border-left:1px dashed #eef0f4;border-bottom:1px solid #f1f3f6}
.gantt .gb{margin:5px 2px;border-radius:4px;height:16px;z-index:1;position:relative}
.gantt .gm{z-index:2;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#b91c1c;white-space:nowrap}
.gantt .gm b{display:inline-block;width:12px;height:12px;background:#dc2626;transform:rotate(45deg);margin-right:6px}
.tr-row{display:grid;grid-template-columns:260px 1fr;align-items:center;border-bottom:1px solid #f1f3f6;min-height:26px}
.tr-track{position:relative;height:26px;background-image:linear-gradient(90deg,#e5e7eb 1px,transparent 1px);background-size:20% 100%}
.tr-bar{position:absolute;top:5px;height:16px;border-radius:4px;color:#fff;font-size:10px;padding:1px 6px;white-space:nowrap;overflow:hidden;cursor:pointer}
/* team */
.org{display:flex;flex-direction:column;align-items:center;margin-top:6px}
.org .vl{width:2px;height:20px;background:#94a3b8}
.branches{display:grid;gap:16px;width:100%}
.br{position:relative;padding-top:20px;display:flex;flex-direction:column;align-items:stretch}
.br::before{content:'';position:absolute;top:0;left:-8px;right:-8px;height:2px;background:#94a3b8}
.br:first-child::before{left:50%}.br:last-child::before{right:50%}
.br::after{content:'';position:absolute;top:0;left:calc(50% - 1px);width:2px;height:20px;background:#94a3b8}
.wsh{color:#fff;border-radius:8px;padding:7px 10px;font-weight:700;text-align:center;font-size:12.5px}
.kids{display:flex;flex-direction:column;gap:10px;margin:0 0 0 18px;padding:12px 0 0 18px;border-left:2px solid #94a3b8}
.kids .pc{position:relative}
.kids .pc::before{content:'';position:absolute;left:-20px;top:34px;width:18px;height:2px;background:#94a3b8}
.kids .pc:last-child::after{content:'';position:absolute;left:-21px;top:36px;bottom:0;width:4px;background:#fff}
.pc{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:10px 12px;background:#fff;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.pc.top{width:440px;max-width:100%;background:linear-gradient(135deg,#f8fafc,#eef2ff)}
.pc .av{width:56px;height:56px;flex:none;border-radius:50%;overflow:hidden;background:#e2e8f0;border:3px solid var(--c);display:flex;align-items:flex-end;justify-content:center}
.pc.top .av{width:68px;height:68px}
.pc .av img{width:100%;height:100%;object-fit:cover}
.pc .r{font-weight:700;color:var(--navy);line-height:1.2}
.pc .nm{font-size:11px;color:var(--mut);font-style:italic}
.pc .a{font-size:11px;color:#334155;margin:3px 0 4px}
.alloc{display:inline-block;background:#0b2545;color:#fff;border-radius:4px;padding:0 5px;font-weight:700;margin-right:4px}
.alloc.pt{background:#f59e0b}
.aitg{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:3px 10px 3px 4px;cursor:pointer;font:inherit;font-size:12px;font-weight:600;white-space:nowrap;flex-shrink:0;margin-left:auto}
.aitg .sw{width:34px;height:18px;border-radius:999px;background:#64748b;position:relative;transition:background .15s}
.aitg .sw::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.aitg.on{background:#0891b2;border-color:#67e8f9}
.aitg.on .sw{background:#22d3ee}.aitg.on .sw::after{left:18px}
.pc.off{opacity:.45;filter:grayscale(1);border-style:dashed}
.offb{display:inline-block;background:#e2e8f0;color:#475569;border-radius:4px;padding:0 5px;font-size:10.5px;font-weight:700}
.onb{display:inline-block;background:#cffafe;color:#0e7490;border-radius:4px;padding:0 5px;font-size:10.5px;font-weight:700}
.aibox{border:1px solid #67e8f9;background:linear-gradient(120deg,#ecfeff,#f0f9ff);border-radius:10px}
.aicol{background:#ecfeff!important}
.heat{display:grid;grid-template-columns:220px repeat(12,1fr) 70px;font-size:11px}
.heat div{padding:3px 4px;border-bottom:1px solid #f1f3f6;text-align:center}
.heat div.l{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* approach */
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.step{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:8px;padding:10px 12px;cursor:pointer;position:relative}
.step:hover{filter:brightness(1.15)}
.step .n{font-size:22px;font-weight:800;opacity:.35;position:absolute;right:10px;top:4px}
.step b{display:block;font-size:13px;margin-bottom:4px}.step span{font-size:11.5px;color:#cbd5e1}
/* north star */
.ns-dom{display:grid;grid-template-columns:34px 1fr;border-bottom:1px dashed #cbd5e1;padding:8px 0}
.ns-dl{writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-weight:700;font-size:16px;color:var(--c)}
.ns-row{display:grid;grid-template-columns:250px 1fr;gap:10px;align-items:center;margin:3px 0}
.ns-g{background:var(--navy2);color:#fff;padding:7px 10px;border-radius:4px;font-weight:600}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.flow .fb{background:#eef2ff;border:1px solid #c7d2fe;border-radius:8px;padding:8px 10px;min-width:150px;flex:1}
.flow .fb b{color:var(--navy);display:block}.flow .ar{align-self:center;color:#94a3b8;font-size:18px}
.prm{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:center;margin:3px 0;font-size:12px}
.prm2{margin:7px 0;font-size:12px}
.prm2 .pl{display:flex;justify-content:space-between;gap:8px;margin-bottom:2px}
.prm2 .pc2{display:grid;grid-template-columns:1fr 78px 28px;gap:8px;align-items:center}
.prm2 .rng{width:100%;accent-color:var(--navy2);cursor:pointer}
.prm2 .unit{color:#64748b;font-size:11px}
.prm2.chk{display:flex;gap:8px;align-items:flex-start;cursor:pointer;padding:6px 8px;border:1px solid #e2e8f0;border-radius:6px;background:#f8fafc}
.prm2.chk input{width:16px;height:16px;margin-top:1px;flex-shrink:0;accent-color:var(--navy2)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:4px 26px}
.formgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 14px}
.formgrid label{font-size:11px;color:var(--mut);display:block}
code{background:#f1f5f9;padding:1px 5px;border-radius:4px;font-size:12px}
.formula{font-family:Consolas,monospace;background:#f8fafc;border-left:3px solid #6366f1;padding:6px 10px;margin:4px 0;font-size:12px;white-space:pre-wrap}
</style>
</head>
<body>
<header>
  <div class="brand"><b>Rationalisation Workbench</b><span>Risk · Finance ·   Compliance · v0.2</span></div>
  <nav class="tabs" id="tabs"></nav>
    <button class="aitg" id="aiToggle" data-act="toggleAI" title="AI Agents Readiness – apply AI-agent acceleration to effort, duration, onboarding and the business case"><span class="sw"></span><span id="aiLbl">AI Agents Readiness: OFF</span></button>
  <span class="demo" title="All figures are realistic synthetic data for demonstration">Synthetic demo data</span>
</header>
<main id="view"></main>
<div id="tip"></div>
<div id="toast" role="status"></div>
<div id="dlg" class="modal hide"><div class="mbox dlg" role="alertdialog" aria-modal="true"><div id="dlgBody"></div><div class="toolbar" style="justify-content:flex-end"><button class="btn ghost" data-act="dlgCancel">Cancel</button><button class="btn red" id="dlgOk" data-act="dlgOk">Delete</button></div></div></div>
<div id="modal" class="modal hide"><div class="mbox"><button class="mclose" data-act="closeModal" title="Close">&times;</button><div id="mbody"></div></div></div>
<input type="file" id="fileIn" accept=".json,application/json" style="display:none" data-ch="importFile">
<script>
'use strict';
/* ====================== CONSTANTS ====================== */
const STORE_KEY='claudeRationalisationWB_v1';
const DISP={
  Invest:{c:'#16a34a',d:'Strategic & healthy – extend and make it the go-to platform'},
  Retain:{c:'#2563eb',d:'Fit for purpose – sustain with BAU upgrades'},
  Migrate:{c:'#f59e0b',d:'Valuable but technically weak – re-platform / upgrade / move to cloud'},
  Consolidate:{c:'#9333ea',d:'Overlapping – merge functions into a better-scoring platform'},
  Retire:{c:'#dc2626',d:'Low value & low health – decommission'}
};
const DORDER=['Invest','Retain','Migrate','Consolidate','Retire'];
const REMOVED=d=>d==='Consolidate'||d==='Retire';
const BVC=[
  {k:'fit',n:'Functional fit',lo:'Major functional gaps, heavy workarounds',hi:'Fully meets requirements out-of-the-box'},
  {k:'strat',n:'Strategic alignment',lo:'Not aligned with target architecture / strategy',hi:'Core to the bank strategy & target architecture'},
  {k:'reg',n:'Regulatory criticality',lo:'No regulatory dependency',hi:'Directly supports mandatory obligations (CBUAE, FATF, Basel, IFRS)'},
  {k:'user',n:'User satisfaction',lo:'Users dissatisfied, low adoption',hi:'Highly rated, high adoption'},
  {k:'usage',n:'Business criticality & usage',lo:'Niche / rarely used',hi:'Business-critical, used daily across functions'}
];
const THC=[
  {k:'vendor',n:'Vendor support status',lo:'Out of support / end-of-life',hi:'Strategic product, active roadmap, long-term support'},
  {k:'tech',n:'Technology fit',lo:'Obsolete stack, scarce skills',hi:'Modern stack aligned to bank standards'},
  {k:'cloud',n:'Cloud readiness',lo:'Cannot run in cloud',hi:'Cloud-native / SaaS'},
  {k:'sec',n:'Security posture',lo:'Known critical gaps, weak IAM',hi:'SSO, encryption, regular pen-tests, compliant'},
  {k:'integ',n:'Integration complexity (5 = simple)',lo:'Many custom point-to-point batch interfaces',hi:'API-based, standard integration patterns'},
  {k:'data',n:'Data quality & architecture',lo:'Siloed, poor quality, manual reconciliations',hi:'Governed, BCBS 239-aligned data with lineage'}
];
const COST=[
  {k:'lic',n:'Licence / subscription'},{k:'infra',n:'Infrastructure & hosting'},{k:'support',n:'Vendor support / AMC'},
  {k:'people',n:'Internal FTE (run)'},{k:'change',n:'Change & enhancements'}
];
const LVL={3:'Primary',2:'Secondary',1:'Partial / feeds'};
const LSYM={3:'P',2:'S',1:'·'};
const TABS=[['summary','Executive Summary'],['caps','1 · Capabilities'],['matrix','2 · App × Capability Matrix'],['scoring','3 · Scoring'],['dispo','4 · Disposition'],['target','5 · Target State'],['benefits','6 · Benefits'],['howto','How-to'],['settings','Settings']];
const DEFAULT_SETTINGS={
  wBV:{fit:25,strat:25,reg:20,user:15,usage:15},
  wTH:{vendor:20,tech:20,cloud:15,sec:15,integ:15,data:15},
  wComp:{bv:45,th:35,cost:20},

function normalise(s){
  if(!s||!Array.isArray(s.domains)||!Array.isArray(s.caps)||!Array.isArray(s.apps)) throw new Error('Invalid workbench file');
  s.roles=Array.isArray(s.roles)?s.roles:[];

  s.apps.forEach(a=>{
    a.domainIds=Array.isArray(a.domainIds)?a.domainIds:[];
    a.bv=Object.assign(Object.fromEntries(BVC.map(c=>[c.k,3])),a.bv||{});

const AI_ACC={Invest:'accInvest',Retain:'accRetain',Migrate:'accMigrate',Consolidate:'accConsolidate',Retire:'accRetire'};
function compute(useAI){
  const st=state.settings,apps=state.apps,caps=state.caps,map=state.map;
  if(useAI===undefined)useAI=aiOn();
  const AI=st.ai,pc=v=>Math.max(0,Math.min(90,+v||0))/100;
  const m=(a,c)=>+map[a+'|'+c]||0;

  const wavg=(vals,w)=>sum(Object.keys(w),k=>(+vals[k]||0)*(+w[k]||0))/sw(w);
  const R={};
  apps.forEach(a=>{R[a.id]={id:a.id,app:a,tco:sum(COST,c=>+a.cost[c.k]||0),bv:wavg(a.bv,st.wBV),th:wavg(a.th,st.wTH)};});
  const lns=apps.map(a=>Math.log(Math.max(R[a.id].tco,1)));
  const lnMin=Math.min(...lns),lnMax=Math.max(...lns);
  apps.forEach(a=>{
    const r=R[a.id];
    r.cs=(lnMax-lnMin)<1e-9?3:1+4*(lnMax-Math.log(Math.max(r.tco,1)))/(lnMax-lnMin);
    r.caps=caps.filter(c=>m(a.id,c.id)>0).map(c=>c.id);
    r.primary=r.caps.filter(c=>m(a.id,c)===3);
    // redundancy: share of the app's Primary/Secondary capabilities also served (P/S) by another app
    r.ps=r.caps.filter(c=>m(a.id,c)>=2);
    r.redCaps=r.ps.filter(cid=>apps.some(b=>b.id!==a.id&&m(b.id,cid)>=2));
    r.redund=r.ps.length?r.redCaps.length/r.ps.length:0;
    r.redSpend=r.tco*r.redund;

    r.ovPen=(+st.ovl.ovPen||0)*r.redund;
    r.comp=Math.max(1,r.compBase-r.ovPen);
  });
  // dominance: is each primary capability covered (≥ secondary) by a higher-scoring app?
  apps.forEach(a=>{
    const r=R[a.id];
    const base=r.primary.length?r.primary:r.caps.filter(c=>m(a.id,c)>=2);
    const cnt={};r.domCaps=[];r.domBase=base.length;
    base.forEach(cid=>{
      let best=null;
      apps.forEach(b=>{if(b.id!==a.id&&m(b.id,cid)>=2&&R[b.id].comp>r.comp&&(!best||R[b.id].comp>R[best].comp))best=b.id;});
      if(best){cnt[best]=(cnt[best]||0)+1;r.domCaps.push({cap:cid,by:best});}
    });

    r.dominator=Object.keys(cnt).sort((x,y)=>cnt[y]-cnt[x]||R[y].comp-R[x].comp)[0]||null;
  });
  const t=st.thr;
  apps.forEach(a=>{
    const r=R[a.id],hiB=r.bv>=t.bv,hiT=r.th>=t.th,why=[];let d,ab=null;
    const isInv=r.bv>=t.investBV&&r.th>=t.investTH,domHit=!!(r.dominator&&r.domRatio>=t.dom),protect=!!(+st.ovl.protectInvest);
    why.push(`Business value ${f2(r.bv)} ${hiB?'≥':'<'} ${t.bv} → ${hiB?'HIGH':'LOW'} value`);
    why.push(`Technical health ${f2(r.th)} ${hiT?'≥':'<'} ${t.th} → ${hiT?'HEALTHY':'UNHEALTHY'}`);
    if(r.redCaps.length)why.push(`Redundancy: ${r.redCaps.length} of ${r.ps.length} Primary/Secondary capabilities also served by another app (${Math.round(r.redund*100)}%, ${money(r.redSpend)}/yr redundant spend) → composite −${f2(r.ovPen)}`);
    if(a.override&&DISP[a.override]){
      d=a.override;why.push('Manual override set by workbench user');
      if(REMOVED(d))ab=(a.overrideTarget&&R[a.overrideTarget]&&a.overrideTarget!==a.id)?a.overrideTarget:r.dominator;
    }else if(isInv&&(!domHit||protect)){
      d='Invest';why.push(`Rule 2: BV ≥ ${t.investBV} and TH ≥ ${t.investTH} → strategic platform, INVEST`+(domHit?' (protected from consolidation by setting)':r.redCaps.length?' – the best-scoring app on its overlapping capabilities':''));
    }else if(domHit){
      ab=r.dominator;d=(!hiB&&!hiT)?'Retire':'Consolidate';
      why.push(`Rule 1: ${Math.round(r.domRatio*100)}% of its primary capabilities are covered by higher-scoring apps (trigger ≥ ${Math.round(t.dom*100)}%)`);
      if(isInv)why.push('Meets the Invest bar, but duplicates a better-scoring platform → Invest not granted (paying for both would be redundant)');
      why.push(d==='Retire'?`Low value & unhealthy → RETIRE; functions absorbed by ${appName(ab)}`:`Overlap with a better platform → CONSOLIDATE into ${appName(ab)}`);
    }else if(hiB&&hiT){d='Retain';why.push('Rule 3: high value & healthy but below Invest bar → RETAIN (sustain)');}
    else if(hiB){d='Migrate';why.push('Rule 3: high value but unhealthy, no better alternative → MIGRATE (re-platform / upgrade)');}
    else if(hiT){d='Retain';why.push('Rule 3: low value but healthy, no better alternative → RETAIN (tolerate, review next cycle)');}

  });
  // effort
  apps.forEach(a=>{
    const r=R[a.id];

  byD('Retain').forEach(r=>{r.start=0;});
  byD('Migrate').sort((x,y)=>((+x.app.th.vendor)-(+y.app.th.vendor))||(y.bv-x.bv)).forEach((r,i)=>{r.start=Math.round((+P.migStart)+i*(+P.migStagger)*sf);});

  apps.forEach(a=>{

    const it={from:a.id,users,ncaps:x.caps.length,trainBase:users*(+f.trainPerUser||0),dataBase:(+f.dataMigBase||0)+x.caps.length*(+f.dataMigPerCap||0),start:x.start,dur:x.dur};
    // AI: tutors / copilots shorten training; mapping & reconciliation agents cut data-migration effort (scaled by the source app's readiness)
    it.train=it.trainBase*(1-(useAI?pc(AI.train):0));
    it.data=it.dataBase*(1-(useAI?pc(AI.data)*x.aiMult:0));
    it.total=it.train+it.data;it.totalBase=it.trainBase+it.dataBase;
    s.onboardItems.push(it);s.onboard+=it.total;s.oneOff+=it.total;
  });
  // redundancy remaining in the target state
  apps.forEach(a=>{
    const r=R[a.id];
    if(REMOVED(r.disp)){r.redAfterCaps=[];r.redundAfter=0;r.redSpendAfter=0;return;}
    const ps=caps.filter(c=>(+mapAfter[a.id+'|'+c.id]||0)>=2).map(c=>c.id);
    r.redAfterCaps=ps.filter(cid=>survivors.some(b=>b.id!==a.id&&(+mapAfter[b.id+'|'+cid]||0)>=2));
    r.redundAfter=ps.length?r.redAfterCaps.length/ps.length:0;
    r.redSpendAfter=r.tcoAfter*r.redundAfter;
    if(r.redAfterCaps.length){
      const peers=[...new Set(r.redAfterCaps.flatMap(cid=>survivors.filter(b=>b.id!==a.id&&(+mapAfter[b.id+'|'+cid]||0)>=2).map(b=>b.name)))];
      r.why.push(`Target state: still overlaps on ${r.redAfterCaps.length} capabilit${r.redAfterCaps.length>1?'ies':'y'} with ${peers.join(', ')} (${money(r.redSpendAfter)}/yr redundant spend) → review, or lower the consolidation trigger / record an override`);
    }
  });
  // cash-flow (60 months)
  const H=60,cash=new Array(H).fill(0);
  apps.forEach(a=>{
    const r=R[a.id];
    if(r.dur>0){for(let k=r.start;k<r.end&&k<H;k++)cash[k]-=r.oneOffBase/r.dur;}else if(r.oneOffBase&&r.start<H)cash[r.start]-=r.oneOffBase;
    r.onboardItems.forEach(it=>{if(it.dur>0){for(let k=it.start;k<it.start+it.dur&&k<H;k++)cash[k]-=it.total/it.dur;}else if(it.start<H)cash[it.start]-=it.total;});
    const sv=(r.saving-r.aiOps)/12;
    if(r.disp==='Invest'){for(let k=r.start;k<H;k++)cash[k]+=sv;}
    else if(r.disp!=='Retain'){for(let k=Math.max(0,r.end);k<H;k++)cash[k]+=sv;}
    if(r.aiOps){for(let k=Math.max(0,+AI.opsStart||0);k<H;k++)cash[k]+=r.aiOps/12;}
  });
  // agent platform: one-off enablement over months 0–5, then annual run cost
  const aiSetup=useAI?Math.max(0,+AI.platSetup||0):0,aiRun=useAI?Math.max(0,+AI.platRun||0):0;
  if(useAI){for(let k=0;k<6;k++)cash[k]-=aiSetup/6;for(let k=0;k<H;k++)cash[k]-=aiRun/12;}
  const cum=[];cash.reduce((s,v,i)=>(cum[i]=s+v),0);
  let payback=null;for(let i=1;i<H;i++){if(cum[i]>=0&&cum[i-1]<0){payback=i;}}
  if(payback!=null&&cum.slice(payback).some(v=>v<0))payback=null;
  const npv=sum(cash.map((v,i)=>v/Math.pow(1+f.discount/1200,i)));
  // capability statistics
  const capStats=(mp,list,thKey)=>{
    let ov=0,gaps=0,tot=0,n=0,regH=0,regN=0,critRisk=0;const per={};
    caps.forEach(c=>{
      const ap=list.filter(a=>(+mp[a.id+'|'+c.id]||0)>=2),any=list.filter(a=>(+mp[a.id+'|'+c.id]||0)>=1);
      per[c.id]=ap.map(a=>a.id);
      if(ap.length>=2)ov++;if(!ap.length)gaps++;if(any.length){tot+=any.length;n++;}
      const healthy=ap.some(a=>R[a.id][thKey]>=t.th);
      if(c.reg){regN++;if(healthy)regH++;}
      if(c.crit==='H'&&!healthy)critRisk++;
    });
    return {ov,gaps,avg:n?tot/n:0,per,reg:regN?regH/regN:0,critRisk};
  };
  const capB=capStats(map,apps,'th'),capA=capStats(mapAfter,survivors,'thAfter');
  const vnorm=v=>{v=String(v||'').trim().toLowerCase();return v.startsWith('in-house')?'in-house':v;};
  const K={
    appsB:apps.length,appsA:survivors.length,
    vendB:new Set(apps.map(a=>vnorm(a.vendor))).size,vendA:new Set(survivors.map(a=>vnorm(a.vendor))).size,
    tcoB:sum(apps,a=>R[a.id].tco),tcoA:sum(apps,a=>R[a.id].tcoAfter+R[a.id].absorbCost),
    invest:sum(apps,a=>R[a.id].oneOff),onboard:sum(apps,a=>R[a.id].onboard),
    onboardInvest:sum(apps.filter(a=>R[a.id].disp==='Invest'),a=>R[a.id].onboard),
    redB:sum(apps,a=>R[a.id].redSpend),redA:sum(apps,a=>R[a.id].redSpendAfter),
    intfB:sum(apps,a=>+a.interfaces||0),intfA:sum(survivors,a=>+a.interfaces||0)+sum(apps.filter(a=>REMOVED(R[a.id].disp)&&R[a.id].absorber),a=>0.25*(+a.interfaces||0)),
    ovB:capB.ov,ovA:capA.ov,gapsB:capB.gaps,gapsA:capA.gaps,avgB:capB.avg,avgA:capA.avg,
    thB:avg(apps,a=>R[a.id].th),thA:avg(survivors,a=>R[a.id].thAfter),
    eolB:apps.filter(a=>+a.th.vendor<=2).length,eolA:survivors.filter(a=>R[a.id].vendorAfter<=2).length,
    secB:avg(apps,a=>+a.th.sec),secA:avg(survivors,a=>R[a.id].secAfter),
    leadB:avg(apps,a=>+a.leadTime||0),leadA:avg(survivors,a=>R[a.id].leadAfter),
    regB:capB.reg,regA:capA.reg,critB:capB.critRisk,critA:capA.critRisk,
    onpremB:apps.filter(a=>/on-prem/i.test(a.deploy)).length,onpremA:survivors.filter(a=>/on-prem/i.test(a.deploy)&&R[a.id].disp!=='Migrate').length,
    peopleB:sum(apps,a=>+a.cost.people||0),peopleA:sum(survivors,a=>(+a.cost.people||0)*(R[a.id].disp==='Migrate'?1-f.migSave/100:1)),
    payback,npv,net5:cum[H-1],peak:Math.min(0,...cum)
  };
  K.ai=useAI;K.aiSetup=aiSetup;K.aiRun=aiRun;K.aiOps=sum(apps,a=>R[a.id].aiOps);
  K.investApps=K.invest;K.invest+=aiSetup;K.tcoA+=aiRun;
  K.planEnd=Math.max(0,...apps.map(a=>R[a.id].disp==='Retain'?0:R[a.id].end));
  K.onboardBase=sum(apps,a=>sum(R[a.id].onboardItems,it=>it.totalBase));
  K.arsAvg=avg(apps,a=>R[a.id].ars);
  K.save=K.tcoB-K.tcoA;
  K.simp=avg([[K.appsB,K.appsA],[K.vendB,K.vendA],[K.intfB,K.intfA],[K.ovB||1,K.ovA]].map(([b,a])=>b?(b-a)/b:0))*100;
  // domain stats (by primary domain)
  const dstats=state.domains.map(d=>{
    const list=apps.filter(a=>pdom(a)===d.id);
    const cnt=Object.fromEntries(DORDER.map(k=>[k,list.filter(a=>R[a.id].disp===k).length]));
    return {d,list,cnt,tcoB:sum(list,a=>R[a.id].tco),tcoA:sum(list,a=>R[a.id].tcoAfter+R[a.id].absorbCost),invest:sum(list,a=>R[a.id].oneOff),after:list.filter(a=>!REMOVED(R[a.id].disp)).length,caps:caps.filter(c=>c.domainId===d.id).length};
  });
  // teams impacted
  const W={Invest:1,Migrate:2,Consolidate:3,Retire:3},teams={};
  const addT=(name,type,app,w,how)=>{if(!name)return;const k=type+'|'+name;const x=teams[k]=teams[k]||{name,type,apps:[],score:0,users:0};x.apps.push({id:app.id,how});x.score+=w;x.users+=+app.users||0;};
  apps.forEach(a=>{const r=R[a.id];if(W[r.disp]){addT(a.bizTeam,'Business',a,W[r.disp],r.disp);addT(a.itTeam,'IT',a,W[r.disp],r.disp);}});
  Object.keys(absorbs).forEach(id=>{const a=appById(id);addT(a.bizTeam,'Business',a,absorbs[id].length,'Absorbs '+absorbs[id].length);addT(a.itTeam,'IT',a,absorbs[id].length,'Absorbs '+absorbs[id].length);});
  const teamList=Object.values(teams).map(x=>Object.assign(x,{level:x.score>=6?'High':x.score>=3?'Medium':'Low'})).sort((a,b)=>b.score-a.score);
  // process owners impacted
  const owners={};
  caps.forEach(c=>{const b=capB.per[c.id].slice().sort().join(),a2=capA.per[c.id].slice().sort().join();if(b!==a2){const k=c.owner||'—';(owners[k]=owners[k]||[]).push(c.id);}});
  return {R,mapAfter,absorbs,K,cash,cum,H,survivors,dstats,teamList,owners,capB,capA};
}

/* ====================== SVG CHARTS ====================== */
function donut(parts,size=170,thick=28,center='',sub=''){
  const tot=sum(parts,p=>p.v)||1,r=(size-thick)/2,C=2*Math.PI*r;let off=0;
  const segs=parts.filter(p=>p.v>0).map(p=>{const len=p.v/tot*C;const s=`<circle r="${r}" cx="${size/2}" cy="${size/2}" fill="none" stroke="${p.c}" stroke-width="${thick}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})" data-tip="${esc(p.l+': '+p.v)}"></circle>`;off+=len;return s;}).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${segs}<text x="50%" y="48%" text-anchor="middle" font-size="24" font-weight="700" fill="#0b2545">${esc(center)}</text><text x="50%" y="62%" text-anchor="middle" font-size="11" fill="#6b7280">${esc(sub)}</text></svg>`;
}
function scatter(){
  const W=720,H=470,p=48,t=state.settings.thr;
  const x=v=>p+(v-1)/4*(W-2*p),y=v=>H-p-(v-1)/4*(H-2*p);

  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">`;
  s+=`<rect x="${x(t.th)}" y="${p}" width="${x(5)-x(t.th)}" height="${y(t.bv)-p}" fill="#eff6ff"/><rect x="${p}" y="${p}" width="${x(t.th)-p}" height="${y(t.bv)-p}" fill="#fffbeb"/><rect x="${p}" y="${y(t.bv)}" width="${x(t.th)-p}" height="${H-p-y(t.bv)}" fill="#fef2f2"/><rect x="${x(t.th)}" y="${y(t.bv)}" width="${x(5)-x(t.th)}" height="${H-p-y(t.bv)}" fill="#f8fafc"/>`;
  s+=`<rect x="${x(t.investTH)}" y="${p}" width="${x(5)-x(t.investTH)}" height="${y(t.investBV)-p}" fill="#dcfce7" stroke="#16a34a" stroke-dasharray="4 3"/>`;
  for(let v=1;v<=5;v++){s+=`<line x1="${x(v)}" x2="${x(v)}" y1="${p}" y2="${H-p}" stroke="#e5e7eb"/><line y1="${y(v)}" y2="${y(v)}" x1="${p}" x2="${W-p}" stroke="#e5e7eb"/><text x="${x(v)}" y="${H-p+16}" font-size="11" text-anchor="middle" fill="#6b7280">${v}</text><text x="${p-10}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="#6b7280">${v}</text>`;}
  s+=`<text x="${W/2}" y="${H-8}" font-size="12" text-anchor="middle" fill="#0b2545" font-weight="600">Technical health →</text><text transform="translate(14 ${H/2}) rotate(-90)" font-size="12" text-anchor="middle" fill="#0b2545" font-weight="600">Business value →</text>`;

function jcurve(){
  const W=760,H=270,p=50,cum=M.cum,n=cum.length,bc=M.K.ai?M.base.cum:null;
  const mn=Math.min(0,...cum,...(bc||[])),mx=Math.max(0,...cum,...(bc||[])),rg=(mx-mn)||1;

    const bp=M.base.K.payback;if(bp!=null)s+=`<circle cx="${x(bp)}" cy="${y(bc[bp])}" r="4.5" fill="#94a3b8"/><text x="${x(bp)}" y="${y(bc[bp])+18}" font-size="10.5" text-anchor="middle" fill="#64748b">Baseline payback M${bp}</text>`;

    s+=`<g font-size="11"><line x1="${p+10}" x2="${p+34}" y1="14" y2="14" stroke="#0891b2" stroke-width="2.5"/><text x="${p+38}" y="18" fill="#0e7490" font-weight="700">AI-accelerated</text><line x1="${p+140}" x2="${p+164}" y1="14" y2="14" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/><text x="${p+168}" y="18" fill="#64748b">Baseline (no AI agents)</text></g>`;
  }
  s+=`<polyline points="${pts}" fill="none" stroke="${bc?'#0891b2':'#0b2545'}" stroke-width="2.5"/>`;
  if(M.K.payback!=null){const i=M.K.payback;s+=`<circle cx="${x(i)}" cy="${y(cum[i])}" r="6" fill="#16a34a"/><text x="${x(i)}" y="${y(cum[i])-12}" font-size="11.5" text-anchor="middle" fill="#15803d" font-weight="700">Payback month ${i}</text>`;}
  s+=`<text x="${x(n-1)}" y="${y(cum[n-1])-8}" font-size="11.5" text-anchor="end" fill="#0b2545" font-weight="700">${money(cum[n-1])}</text>`;
  return s+'</svg>';
}

  const byOwner=state.roles.map(r=>({r,n:caps.filter(c=>c.owner===r.id).length})).filter(x=>x.n);
  h+=`<div class="card"><h3>Process-owner accountability</h3><div class="pgrid">${byOwner.map(x=>`<div class="hbar" style="grid-template-columns:240px 1fr 30px"><span>${esc(x.r.name)}</span><div class="bar"><i style="width:${x.n/Math.max(...byOwner.map(y=>y.n))*100}%;background:${col(dom(x.r.domainId).color)}"></i></div><b>${x.n}</b></div>`).join('')}</div>${caps.some(c=>!c.owner)?`<div class="warn">${caps.filter(c=>!c.owner).length} capabilities have no process owner.</div>`:''}</div>`;
  return h;
}

function mxBind(){
  const tb=$('#mx');if(!tb)return;
  const cols={};tb.querySelectorAll('[data-c]').forEach(el=>{(cols[el.dataset.c]=cols[el.dataset.c]||[]).push(el);});
  let cc=null,cr=null,cell=null;
  const clear=()=>{if(cc)cols[cc].forEach(e=>e.classList.remove('hlc'));if(cr)cr.classList.remove('hl');if(cell)cell.classList.remove('cur');cc=cr=cell=null;};
  tb.addEventListener('mouseover',e=>{
    const el=e.target.closest('td,th');if(!el)return;
    const c=el.dataset.c,tr=el.closest('tbody tr');
    if(c!==cc){if(cc)cols[cc].forEach(x=>x.classList.remove('hlc'));cc=c||null;if(cc)cols[cc].forEach(x=>x.classList.add('hlc'));}
    if(tr!==cr){if(cr)cr.classList.remove('hl');cr=tr||null;if(cr)cr.classList.add('hl');}
    if(cell)cell.classList.remove('cur');cell=el.classList.contains('c')?el:null;if(cell)cell.classList.add('cur');
    if(cell){const a=appById(cell.dataset.a),cp=state.caps.find(x=>x.id===cell.dataset.k),mp=ui.mx.after?M.mapAfter:state.map,v=+mp[a.id+'|'+cp.id]||0,ro=role(cp.owner);
      const others=(ui.mx.after?M.survivors:state.apps).filter(x=>x.id!==a.id&&(+mp[x.id+'|'+cp.id]||0)>0).map(x=>x.name+' ('+LSYM[+mp[x.id+'|'+cp.id]]+')');
      showTip(e,`${a.name}  ×  ${cp.name}\nLevel: ${v?LVL[v]:'not mapped'}\nOwner: ${ro?ro.name:'—'}\nApp disposition: ${M.R[a.id].disp}\nOther apps: ${others.join(', ')||'none'}${ui.mx.after?'':'\n(click to change)'}`);}
    else if(el.dataset.tip)showTip(e,el.dataset.tip);else hideTip();
  });
  tb.addEventListener('mouseleave',()=>{clear();hideTip();});
}

function onboardTip(r){

}

  h+=`<div class="grid g5">${DORDER.map(d=>{const l=apps.filter(a=>R[a.id].disp===d);return `<div class="card kpi" style="border-top:4px solid ${DISP[d].c};cursor:pointer" data-act="gotoDispo" data-d="${d}"><div class="l">${d}</div><div class="v">${l.length} <span class="small muted">apps</span></div><div class="small">TCO ${money(sum(l,a=>R[a.id].tco))} · one-off ${money(sum(l,a=>R[a.id].oneOff))}${aiOn()?` <span style="color:#0e7490">(was ${money(sum(l,a=>M.base.R[a.id].oneOff))})</span>`:''}</div>${sum(l,a=>R[a.id].onboard)?`<div class="small" style="color:#7e22ce">incl. onboarding ${money(sum(l,a=>R[a.id].onboard))} (training + data migration)</div>`:''}${sum(l,a=>R[a.id].redSpend)?`<div class="small" style="color:#9333ea">redundant spend ${money(sum(l,a=>R[a.id].redSpend))}/yr</div>`:''}<div class="small muted">${DISP[d].d}</div></div>`;}).join('')}</div>`;
  // domain impact
  h+=`<div class="grid g${Math.min(3,Math.max(1,M.dstats.length))}" style="${M.dstats.length>3?'grid-template-columns:repeat(3,1fr)':''}">${M.dstats.map(s=>{
    const cons=s.list.filter(a=>REMOVED(R[a.id].disp));const migs=s.list.filter(a=>R[a.id].disp==='Migrate');

    return `<div class="card" style="border-top:4px solid ${col(s.d.color)}"><div style="display:flex;justify-content:space-between"><h3>${esc(s.d.name)}</h3><a href="#" data-act="gotoDomain" data-dom="${esc(s.d.id)}">Drill down ›</a></div>
    <div style="display:flex;height:14px;border-radius:4px;overflow:hidden;margin-bottom:8px">${DORDER.map(d=>s.cnt[d]?`<div style="width:${s.cnt[d]/tot*100}%;background:${DISP[d].c}" data-tip="${d}: ${s.cnt[d]}"></div>`:'').join('')}</div>
    <div class="grid g3" style="gap:6px"><div><div class="small muted">Apps</div><b>${s.list.length} → ${s.after}</b></div><div><div class="small muted">Run cost</div><b>${money(s.tcoB)} → ${money(s.tcoA)}</b></div><div><div class="small muted">Investment</div><b>${money(s.invest)}</b></div></div>
    <div class="small" style="margin-top:8px">${cons.length?`<b>Decommission:</b> ${cons.map(a=>esc(a.name)+(R[a.id].absorber?' → '+esc(appName(R[a.id].absorber)):'')).join('; ')}.`:'No decommissioning.'} ${migs.length?`<br><b>Modernise:</b> ${migs.map(a=>esc(a.name)).join(', ')}.`:''} <br><b>Savings:</b> ${money(s.tcoB-s.tcoA)}/yr (${pctOf(s.tcoB-s.tcoA,s.tcoB)}%).</div></div>`;}).join('')}</div>`;
  // overlap clusters
  const ovc=state.caps.filter(c=>M.capB.per[c.id].length>=2);
  h+=`<div class="card"><details ${ovc.length<=25?'open':''}><summary>Overlap clusters – ${ovc.length} capabilities served by 2+ applications (Primary/Secondary)</summary><table class="t"><thead><tr><th>Capability</th><th>Domain</th><th>Current applications</th><th>Target platform(s)</th></tr></thead><tbody>
  ${ovc.map(c=>`<tr><td class="b">${esc(c.name)}</td><td>${dchip(c.domainId)}</td><td>${M.capB.per[c.id].map(id=>achip(id,'gone')).join('')}</td><td>${M.capA.per[c.id].map(id=>achip(id)).join('')||'<span class="pill" style="background:#dc2626">Gap</span>'}</td></tr>`).join('')}</tbody></table></details></div>`;
  // table
  let list=sorted(apps).filter(a=>(f.dom==='all'||a.domainIds.includes(f.dom))&&(f.d==='all'||R[a.id].disp===f.d));
  h+=`<div class="card" id="dispoTable"><h3>Application dispositions</h3><div class="toolbar"><label>Domain <select class="in" data-ch="dispoF" data-k="dom"><option value="all">All</option>${state.domains.map(d=>`<option value="${esc(d.id)}" ${f.dom===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></label><label>Disposition <select class="in" data-ch="dispoF" data-k="d"><option value="all">All</option>${DORDER.map(d=>`<option ${f.d===d?'selected':''}>${d}</option>`).join('')}</select></label><span class="muted small">${list.length} applications · click a name for the full drill-down</span></div>
  <div style="overflow:auto"><table class="t"><thead><tr><th>Application</th><th>Domains</th><th class="num">BV</th><th class="num">TH</th><th class="num">Cost eff.</th><th class="num">Composite</th><th class="num">Overlap</th><th class="num" title="TCO × share of P/S capabilities duplicated by another app">Redundant spend</th><th>Disposition</th><th>Override</th><th>Target / absorber</th><th>Effort</th><th class="num">One-off</th><th>Wave · timing</th><th class="num">Annual saving</th></tr></thead><tbody>
  ${list.map(a=>{const r=R[a.id];return `<tr><td><a href="#" class="b" data-act="openApp" data-id="${esc(a.id)}">${esc(a.name)}</a><div class="small muted">${esc(a.vendor)}</div></td><td>${a.domainIds.map(dchip).join('')}</td><td class="num ${sclass(r.bv)}">${f2(r.bv)}</td><td class="num ${sclass(r.th)}">${f2(r.th)}</td><td class="num">${f2(r.cs)}</td><td class="num b">${f2(r.comp)}</td><td class="num" data-tip="${esc(r.domCaps.map(x=>state.caps.find(c=>c.id===x.cap).name+' ← '+appName(x.by)).join('\n')  ||'No primary capability covered by a better app')}">${Math.round(r.domRatio*100)}%</td><td class="num" style="color:${r.redund>=0.5?'#9333ea':'inherit'}" data-tip="${esc(`Redundancy ${Math.round(r.redund*100)}% (${r.redCaps.length}/${r.ps.length} P/S capabilities)\nComposite penalty −${f2(r.ovPen)}\nTarget state: ${money(r.redSpendAfter)}/yr`)}">${r.redSpend?money(r.redSpend):'–'}</td>
    <td>${dpill(r.disp)}${a.override?' <span class="badge">manual</span>':''}</td>
    <td><select class="in" style="width:115px" data-ch="override" data-id="${esc(a.id)}"><option value="">Auto (rules)</option>${DORDER.map(d=>`<option ${a.override===d?'selected':''}>${d}</option>`).join('')}</select>${REMOVED(a.override)?`<select class="in" style="width:115px;margin-top:3px" data-ch="overrideTarget" data-id="${esc(a.id)}"><option value="">Auto target</option>${sorted(state.apps).filter(x=>x.id!==a.id).map(x=>`<option value="${esc(x.id)}" ${a.overrideTarget===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:''}</td>
    <td>${r.absorber?achip(r.absorber):REMOVED(r.disp)?'<span class="pill" style="background:#dc2626">Gap – decide</span>':r.disp==='Migrate'?'<span class="small">Modernised version (cloud / upgrade)</span>':''}</td>
    <td><b>${r.disp==='Retain'?'BAU':r.size}</b> <span class="small muted">${r.durBase?(r.dur!==r.durBase?`<s>${r.durBase}</s> → <b style="color:#0e7490">${r.dur} mo</b>`:r.dur+' mo'):''}</span>${r.aiAcc?`<div class="small" style="color:#0e7490" data-tip="${esc(`AI agent readiness ${f2(r.ars)}/5 → multiplier ×${f2(r.aiMult)}\n${r.disp} acceleration ${state.settings.ai[AI_ACC[r.disp]]}% × ${f2(r.aiMult)} = ${Math.round(r.aiAcc*100)}%`)}">🤖 −${Math.round(r.aiAcc*100)}% · ARS ${f1(r.ars)}</div>`:''}</td><td class="num" data-tip="${esc(onboardTip(r))}">${money(r.oneOff)}${r.onboard?`<div class="small" style="color:#7e22ce">incl. ${money(r.onboard)} onboarding</div>`:''}</td><td class="small">${r.wave}${r.dur?` · M${r.start}–M${r.end}`:''}</td><td class="num b" style="color:${r.saving>=0?'#15803d':'#b91c1c'}">${money(r.saving)}</td></tr>`;}).join('')}
  </tbody><tfoot><tr><td class="b" colspan="7">Total (${list.length} apps)</td><td class="num b">${money(sum(list,a=>R[a.id].redSpend))}</td><td colspan="4"></td><td class="num b">${money(sum(list,a=>R[a.id].oneOff))}</td><td></td><td class="num b">${money(sum(list,a=>R[a.id].saving))}</td></tr></tfoot></table></div></div>`;
  return h;
}

/* ====================== RENDER: TARGET STATE ====================== */
function rTarget(){
  const R=M.R,v=ui.target.view,after=v==='target';
  const mp=after?M.mapAfter:state.map;
  const list=after?M.survivors:state.apps;
  let h=`<div class="card"><h2>5 · Target-state architecture (north star)</h2><p class="sub">Application landscape per domain and capability area ${after?'<b>after</b>':'<b>before</b>'} the rationalisation plan. Chips are coloured by disposition; consolidated applications’ capabilities are transferred to their surviving platform.</p>
  <div class="toolbar"><button class="btn ${after?'ghost':''}" data-act="tview" data-v="current">Current state (${state.apps.length} apps)</button><button class="btn ${after?'':'ghost'}" data-act="tview" data-v="target">Target state (${M.survivors.length} apps)</button><span class="lg">${DORDER.map(d=>`<span class="dot" style="background:${DISP[d].c}"></span>${d}`).join(' &nbsp;')}</span></div>`;
  state.domains.forEach(d=>{
    const dc=state.caps.filter(c=>c.domainId===d.id);if(!dc.length)return;
    h+=`<div class="ns-dom" style="--c:${col(d.color)}"><div class="ns-dl">${esc(d.name)}</div><div>`;
    [...new Set(dc.map(c=>c.group))].forEach(g=>{
      const gc=dc.filter(c=>c.group===g);
      const ap=list.filter(a=>gc.some(c=>(+mp[a.id+'|'+c.id]||0)>=2));
      const gaps=gc.filter(c=>!list.some(a=>(+mp[a.id+'|'+c.id]||0)>=2));
      h+=`<div class="ns-row"><div class="ns-g">${esc(g)} <span style="opacity:.6;font-weight:400">· ${gc.length}</span></div><div>${ap.map(a=>{const r=R[a.id];const abs=after&&M.absorbs[a.id]?` <small>+${M.absorbs[a.id].length} absorbed</small>`:'';const tag=after&&r.disp==='Migrate'?' <small>modernised</small>':'';return `<span class="achip ${!after&&REMOVED(r.disp)?'gone':''}" style="background:${DISP[r.disp].c}" data-act="openApp" data-id="${esc(a.id)}" data-tip="${esc(a.name+' – '+r.disp+(M.absorbs[a.id]?'\nAbsorbs: '+M.absorbs[a.id].map(appName).join(', '):'')+(r.absorber?'\n→ '+appName(r.absorber):''))}">${esc(a.name)}${tag}${abs}</span>`;}).join('')}${gaps.length?`<span class="pill" style="background:#fee2e2;color:#b91c1c;margin-left:6px" data-tip="${esc('No Primary/Secondary platform:\n'+gaps.map(c=>c.name).join('\n'))}">${gaps.length} gap${gaps.length>1?'s':''}</span>`:''}</div></div>`;
    });
    h+=`<details style="margin-top:4px"><summary class="small">Capability-level view – ${esc(d.name)}</summary><table class="t"><thead><tr><th>Capability</th><th>Owner</th><th>Current platforms</th><th>Target platforms</th><th>Change</th></tr></thead><tbody>${dc.map(c=>{const b=M.capB.per[c.id],a=M.capA.per[c.id];const ch=b.slice().sort().join()!==a.slice().sort().join();return `<tr><td>${esc(c.name)}</td><td class="small">${esc((role(c.owner)||{}).name||'—')}</td><td>${b.map(id=>achip(id,'gone')).join('')}</td><td>${a.map(id=>achip(id)).join('')||'<span class="pill" style="background:#dc2626">Gap</span>'}</td><td>${ch?'<span class="badge" style="background:#fef3c7;color:#92400e">changes</span>':'<span class="small muted">—</span>'}</td></tr>`;}).join('')}</tbody></table></details>`;
    h+='</div></div>';
  });
  h+='</div>';
  // transformation roadmap
  const rows=state.apps.filter(a=>R[a.id].disp!=='Retain').sort((a,b)=>R[a.id].start-R[b.id].start||R[a.id].end-R[b.id].end);
  const AIon=aiOn(),BR=M.base.R;
  const HZ=Math.max(60,...rows.map(a=>Math.max(R[a.id].end,BR[a.id].end)));
  h+=`<div class="card"><h3>3–5 year rationalisation roadmap${AIon?' <span class="onb">🤖 AI-accelerated</span>':''}</h3><p class="sub">Initiatives sequenced by wave: retirements first (quick wins), migrations staggered by vendor-support urgency, consolidations scheduled after their target platform is ready. Bar = start → completion; savings start at completion.${AIon?` <b style="color:#0e7490">Dashed outline = baseline timing without AI agents.</b> Plan completes in month ${M.K.planEnd} instead of ${M.base.K.planEnd}.`:''}</p>
  <div class="tr-row" style="font-weight:700;color:var(--navy)"><div>Initiative</div><div style="display:grid;grid-template-columns:repeat(${Math.ceil(HZ/12)},1fr)">${Array.from({length:Math.ceil(HZ/12)},(_,i)=>`<div style="padding-left:4px">Year ${i+1}</div>`).join('')}</div></div>
  ${rows.map(a=>{const r=R[a.id];return `<div class="tr-row"><div class="small" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><span class="dot" style="background:${DISP[r.disp].c}"></span>${esc(a.name)}</div><div class="tr-track" style="background-size:${1200/HZ}% 100%">${AIon?`<div class="tr-bar" style="left:${BR[a.id].start/HZ*100}%;width:${Math.max(1,BR[a.id].dur)/HZ*100}%;background:transparent;border:1.5px dashed #94a3b8;pointer-events:none"></div>`:''}<div class="tr-bar" style="left:${r.start/HZ*100}%;width:${Math.max(1,r.dur)/HZ*100}%;background:${DISP[r.disp].c}" data-act="openApp" data-id="${esc(a.id)}" data-tip="${esc(`${a.name}: ${r.disp}${r.absorber?' → '+appName(r.absorber):''}\n${r.wave} · month ${r.start} → ${r.end} · ${r.size}${AIon?`\nBaseline (no AI): month ${BR[a.id].start} → ${BR[a.id].end} · AI acceleration −${Math.round(r.aiAcc*100)}% (ARS ${f2(r.ars)})`:''}\nOne-off ${money(r.oneOff)} · saving ${money(r.saving)}/yr`)}">${r.disp}${r.absorber?' → '+esc(appName(r.absorber)):''}</div></div></div>`;}).join('')}
  <div class="small muted" style="margin-top:6px">${state.apps.filter(a=>R[a.id].disp==='Retain').length} Retain applications continue under BAU and are not shown.</div></div>`;
  // teams
  h+=`<div class="grid g2"><div class="card"><h3>Teams impacted</h3><table class="t"><thead><tr><th>Team</th><th>Type</th><th>Impact</th><th>Applications changing</th><th class="num">Users</th></tr></thead><tbody>${M.teamList.map(t=>`<tr><td class="b">${esc(t.name)}</td><td>${t.type}</td><td><span class="pill" style="background:${t.level==='High'?'#dc2626':t.level==='Medium'?'#f59e0b':'#64748b'}">${t.level}</span></td><td>${t.apps.map(x=>`<span class="small" style="white-space:nowrap"><span class="dot" style="background:${DISP[R[x.id].disp].c}"></span>${esc(appName(x.id))} <span class="muted">(${esc(x.how)})</span></span>`).join('<br>')}</td><td class="num">${t.users}</td></tr>`).join('')}</tbody></table><div class="small muted">Impact score: Retire/Consolidate 3, Migrate 2, Invest 1, +1 per app absorbed. High ≥ 6, Medium ≥ 3.</div></div>
  <div class="card"><h3>Process owners impacted</h3><table class="t"><thead><tr><th>Process owner</th><th class="num">Capabilities changing platform</th><th>Capabilities</th></tr></thead><tbody>${Object.entries(M.owners).sort((a,b)=>b[1].length-a[1].length).map(([rid,cl])=>`<tr><td class="b">${esc((role(rid)||{}).name||'Unassigned')}</td><td class="num">${cl.length}</td><td class="small">${cl.map(id=>esc(state.caps.find(c=>c.id===id).name)).join('; ')}</td></tr>`).join('')}</tbody></table></div></div>`;
  return h;
}

  const rows=[
    ['Cost','Annual run cost (TCO)',K.tcoB,K.tcoA,true,money,'Σ TCO of surviving apps after migration savings / invest uplift + absorption uplift on survivors'],
    ['Cost','Internal run FTE cost',K.peopleB,K.peopleA,true,money,'People cost of surviving apps (migrated apps reduced by migration saving %)'],
    ['Cost','Redundant spend (duplicated capability)',K.redB,K.redA,true,money,'Σ TCO × share of each app’s Primary/Secondary capabilities also served by another app'],

      ['AI acceleration','Payback month',M.base.K.payback==null?60:M.base.K.payback,K.payback==null?60:K.payback,true,v=>v>=60?'> 60':'M'+v,'Baseline vs AI-assisted cumulative cash-flow break-even'],

    ]:[]),
    ['Cost','5-year net benefit / NPV',0,K.net5,false,money,`Cumulative cash-flow month 0–59; NPV ${money(K.npv)} at ${state.settings.fin.discount}%`],
    ['Simplification','Applications',K.appsB,K.appsA,true,v=>Math.round(v),'Apps not Consolidated / Retired'],
    ['Simplification','Vendors / platforms',K.vendB,K.vendA,true,v=>Math.round(v),'Distinct vendors of surviving apps (in-house counted once)'],
    ['Simplification','Interfaces',K.intfB,K.intfA,true,v=>Math.round(v),'Interfaces of survivors + 25% of removed apps’ interfaces re-pointed'],

    ['Simplification','Avg applications per capability',K.avgB,K.avgA,true,f2,'Mean number of apps mapped (any level) per covered capability'],
    ['Risk','Apps at vendor-support risk (score ≤ 2)',K.eolB,K.eolA,true,v=>v,'Migrated apps assumed on supported versions (score 4)'],
    ['Risk','High-criticality capabilities without a healthy platform',K.critB,K.critA,true,v=>v,`No Primary/Secondary app with TH ≥ ${state.settings.thr.th}`],

    ['Agility','Average change lead time (days)',K.leadB,K.leadA,true,v=>Math.round(v),`Migrate −${state.settings.fin.leadMig}%, Invest −${state.settings.fin.leadInv}%`],

    ['Regulatory','Capability gaps (no Primary/Secondary platform)',K.gapsB,K.gapsA,true,v=>v,'Gaps must be resolved before decommissioning']
  ];
  const cats=['Cost','Simplification','Risk','Agility','Regulatory',...(K.ai?['AI acceleration']:[])],cc={Cost:'#16a34a',Simplification:'#4338ca',Risk:'#dc2626',Agility:'#0e7490',Regulatory:'#be185d','AI acceleration':'#0891b2'};
  let h=`<div class="card"><h2>6 · Quantified benefits</h2><p class="sub">Measurable outcomes compared between baseline and target state. Every metric is recalculated from the dispositions; assumptions are editable below.</p>

  h+=`<div class="grid g12"><div class="card"><h3>Cumulative net benefit (J-curve, 5 years)</h3>${jcurve()}<div class="small muted">Investment is spread evenly over each initiative’s duration (absorption onboarding over the absorbed app’s migration window); savings start the month after completion; Invest run-cost uplift starts immediately. Peak funding need: <b>${money(K.peak)}</b>.</div></div>
  <div class="card"><h3>Run cost by domain</h3>${M.dstats.map(s=>{const mx=Math.max(...M.dstats.map(x=>x.tcoB),1);return `<div style="margin:8px 0"><div class="b">${esc(s.d.name)} <span class="muted small">−${money(s.tcoB-s.tcoA)} (−${pctOf(s.tcoB-s.tcoA,s.tcoB)}%)</span></div>${hbar('Baseline',s.tcoB,mx,'#94a3b8',money(s.tcoB))}${hbar('Target',s.tcoA,mx,col(s.d.color),money(s.tcoA))}</div>`;}).join('')}</div></div>`;
  const contrib=state.apps.filter(a=>Math.abs(R[a.id].saving)>0.5).sort((a,b)=>R[b.id].saving-R[a.id].saving);
  const mx=Math.max(1,...contrib.map(a=>Math.abs(R[a.id].saving)));
  h+=`<div class="card"><h3>Saving contributors (annual, steady state)</h3><div class="pgrid">${contrib.map(a=>{const r=R[a.id];return `<div class="hbar" style="grid-template-columns:200px 1fr 64px;cursor:pointer" data-act="openApp" data-id="${esc(a.id)}"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><span class="dot" style="background:${DISP[r.disp].c}"></span>${esc(a.name)}</span><div class="bar"><i style="width:${Math.abs(r.saving)/mx*100}%;background:${r.saving>=0?DISP[r.disp].c:'#94a3b8'}"></i></div><b style="color:${r.saving>=0?'#15803d':'#b91c1c'}">${money(r.saving)}</b></div>`;}).join('')}</div><div class="small muted">Negative values = Invest run-cost uplift. Removed apps’ saving is net of the absorption uplift on the survivor.</div></div>`;
  return h;
}

    ['Overlap / dominance %','“Overlap” column in Disposition','Share of an app’s Primary capabilities (or Secondary if it has none) where another app at ≥ Secondary level has a higher composite. The app dominating the most capabilities is the absorber.'],
    ['Disposition','Invest / Retain / Migrate / Consolidate / Retire',`Ordered rules: (0) manual override; (1) dominance ≥ ${Math.round(st.thr.dom*100)}% → Consolidate (Retire if BV < ${st.thr.bv} and TH < ${st.thr.th}) – ${+st.ovl.protectInvest?'apps meeting the Invest bar are protected from this rule (setting “Protect Invest” = 1)':'applies also to apps meeting the Invest bar, so two overlapping platforms are not both funded (set “Protect Invest” = 1 to revert)'}; (2) BV ≥ ${st.thr.investBV} & TH ≥ ${st.thr.investTH} → Invest; (3) quadrant: high BV & healthy → Retain; high BV & unhealthy → Migrate; low BV & healthy → Retain (tolerate); low/low → Retire.`],
    ['Absorber chain','Target platform of a removed app','If the absorber is itself consolidated, the chain is followed to the final surviving platform.'],
    ['Effort','Points, size, duration, one-off cost',`Points = base(disposition: ${DORDER.map(d=>d+' '+st.effort[d]).join(', ')}) × complexity; complexity = 1 + 0.02 × interfaces + 0.04 × capabilities mapped + 0.1 × (5 − integration score) + 0.2 if users > 300. Size: S < 4, M < 9, L < 13, XL ≥ 13 points → ${Object.entries(SIZE_DUR).map(([k,v])=>k+' '+v+' mo').join(', ')}. One-off = points × $${st.fin.costPerPoint}K + absorption onboarding.`],
    ['Absorption onboarding','One-off tooltip in Disposition, app drill-down, Benefits “of which onboarding”',`For every Consolidated/Retired app with a target platform, the receiving platform carries: training = users of the absorbed app × $${st.fin.trainPerUser}K, plus data migration = $${st.fin.dataMigBase}K + $${st.fin.dataMigPerCap}K × capabilities mapped on the absorbed app. Included in the receiver’s one-off (so an Invest platform’s budget covers the training and data migration of everything it absorbs) and phased over the absorbed app’s migration window.`],
    ['Waves & timing','Start / end month, Wave 1–3',`Invest starts months 0–4; migrations start at month ${st.plan.migStart} every ${st.plan.migStagger} months (lowest vendor-support first); retirements at month ${st.plan.retStart} every ${st.plan.retStagger}; consolidations at month ${st.plan.conStart} every ${st.plan.conStagger}. A removed app waits until its absorber’s migration ends (or half of its Invest programme). Wave = start in year 1, 2 or 3+.`],
    ['AI Agents Readiness (toggle)','Top-bar switch; Scoring “AI agent readiness”, Disposition 🤖, Roadmap dashed bars, Benefits “AI acceleration”, Team 🤖 roles',`Agent-readiness score (ARS) = average of ${AIRC.map(c=>c.n).join(', ')} (1–5, prefilled from app type / vendor / TH, editable). Multiplier = 0.3 + 0.7 × (ARS − 1)/4. Per-app acceleration = outcome % (Invest ${st.ai.accInvest}%, Retain ${st.ai.accRetain}%, Migrate ${st.ai.accMigrate}%, Consolidate ${st.ai.accConsolidate}%, Retire ${st.ai.accRetire}%) × multiplier. Effort points and duration × (1 − acceleration) (duration floor ${st.ai.floor} mo); wave staggers −${st.ai.stagger}%; training −${st.ai.train}%, data migration −${st.ai.data}% × the absorbed app’s multiplier. Adds agent platform $${st.ai.platSetup}K one-off + $${st.ai.platRun}K/yr, and AIOps saving ${st.ai.opsSave}% × multiplier of FTE + change cost on survivors from month ${st.ai.opsStart}. Dispositions and composite scores are not changed – AI changes <i>how fast and how cheaply</i>, not <i>what</i>.`],
    ['Target run cost','TCO after per app',`Retain = TCO; Migrate = TCO × (1 − ${st.fin.migSave}%); Invest = TCO × (1 + ${st.fin.investUp}%); Consolidate/Retire = 0, plus ${st.fin.absorb}% of its TCO added to the survivor (absorption uplift).`],
    ['Annual saving','Per app and portfolio','TCO before − TCO after − absorption uplift.'],
    ['Cash-flow, payback, NPV','J-curve','Monthly: −one-off spread over duration (onboarding over the absorbed app’s window); + saving/12 from completion (Invest uplift from start). Payback = first month cumulative turns positive and stays positive. NPV discounted monthly.'],
    ['Target matrix','Matrix “target state” toggle; Target State tab','Survivors keep their mappings; each removed app’s mappings are transferred to its absorber at max(level).'],
    ['Risk metrics','Vendor-support risk, critical capabilities, security, TH',`Vendor-support risk = vendor score ≤ 2 (migrated apps assumed 4). Critical capability at risk = High criticality without a Primary/Secondary app with TH ≥ ${st.thr.th}. Migrated apps: TH → max(TH, ${st.fin.migTH}), security → ≥ 4.`],

  if(r){
    const a=r.app;
    h+=`<div class="card"><h3>Worked example</h3><div class="toolbar"><label>Application <select class="in" data-ch="howApp">${sorted(state.apps).map(x=>`<option value="${esc(x.id)}" ${x.id===ui.howApp?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label></div>

Redundancy = ${r.redCaps.length} of ${r.ps.length} P/S capabilities also served by another app = ${Math.round(r.redund*100)}%  →  redundant spend ${money(r.redSpend)}/yr (target state ${money(r.redSpendAfter)})
Composite after overlap penalty = ${f2(r.compBase)} − ${st.ovl.ovPen}×${f2(r.redund)} = ${f2(r.comp)}
Dominance = ${r.domCaps.length} of ${r.domBase} primary capabilities covered by a better app = ${Math.round(r.domRatio*100)}%${r.dominator?' (best: '+appName(r.dominator)+')':''}
Decision path:
  - ${r.why.join('\n  - ')}
Effort = ${st.effort[r.disp]} × complexity ${f2(r.cf)} = ${f1(r.pointsBase)} points → ${r.disp==='Retain'?'BAU':r.size}, ${r.durBase} months${r.aiAcc?`
 🤖 AI agents: readiness ${f2(r.ars)} → multiplier ${f2(r.aiMult)}; ${r.disp} ${st.ai[AI_ACC[r.disp]]}% × ${f2(r.aiMult)} = −${Math.round(r.aiAcc*100)}%
    → ${f1(r.points)} points, ${r.dur} months`:''}, effort cost ${money(r.oneOffBase)}${r.onboardItems.map(it=>`
 + onboarding ${appName(it.from)}: training ${it.users}×${money(st.fin.trainPerUser)} = ${money(it.trainBase)}${it.train<it.trainBase?` → AI ${money(it.train)}`:''}, data migration ${money(st.fin.dataMigBase)} + ${it.ncaps}×${money(st.fin.dataMigPerCap)} = ${money(it.dataBase)}${it.data<it.dataBase?` → AI ${money(it.data)}`:''}`).join('')}${r.aiOps?`
Run cost after includes AIOps saving −${money(r.aiOps)}/yr`:''}
 = one-off ${money(r.oneOff)}
Timing = ${r.wave}, month ${r.start} → ${r.end}
Run cost after = ${money(r.tcoAfter)} ${r.absorbCost?'+ absorption uplift '+money(r.absorbCost)+' on '+appName(r.absorber):''}  →  annual saving ${money(r.saving)}</div></div>`;
  }
  return h;
}

function startDraft(kind,rec){
  if(ui.draft){
    ui.tab=ui.draft.kind==='cap'?'caps':'settings';
    if(ui.draft.kind==='cap'&&ui.caps.dom!=='all'&&ui.caps.dom!==ui.draft.rec.domainId)ui.caps.dom='all';
    Object.assign(ui.draft,{scroll:true,flash:true});render(true);toast('Save or cancel the unsaved row first.','warn');return;
  }
  ui.draft={kind,rec,err:{},scroll:true,flash:false};render(true);
}
function draftErrors(){
  const {kind,rec}=ui.draft,e={},n=String(rec.name||'').trim(),same=(a,b)=>String(a).trim().toLowerCase()===b.toLowerCase();
  if(!n)e.name='Name is required';
  if(kind==='dom'&&n&&state.domains.some(x=>same(x.name,n)))e.name='A domain with this name already exists';
  if(kind==='role'){if(n&&state.roles.some(x=>same(x.name,n)))e.name='A role with this name already exists';if(!rec.domainId)e.domainId='Domain is required';}
  if(kind==='cap'){if(!String(rec.group||'').trim())e.group='Capability area is required';if(n&&state.caps.some(x=>x.domainId===rec.domainId&&same(x.name,n)))e.name='This capability already exists in the domain';}
  if(kind==='app'){if(n&&state.apps.some(x=>same(x.name,n)))e.name='An application with this name already exists';if(!rec.domainIds.length)e.domainIds='Tick at least one domain';}
  return e;
}
function setDraft(el){

  exportJson:()=>download('rationalisation_workbench_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(state,null,1),'application/json'),
  importJson:()=>$('#fileIn').click(),
  exportCsv:()=>{const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';const rows=[['Application','Vendor','Domains','BV','TH','TCO $K','Cost efficiency','Composite before overlap penalty','Redundancy %','Redundant spend $K','Redundant spend after $K','Composite','Disposition','Target platform','Effort','Effort cost $K','Onboarding (training + data migration) $K','One-off $K','Wave','Start month','End month','Annual saving $K','AI toggle','AI readiness (ARS)','AI multiplier','AI acceleration %','Duration without AI (mo)','Duration (mo)','One-off without AI $K','AIOps saving $K']];sorted(state.apps).forEach(a=>{const r=M.R[a.id];rows.push([a.name,a.vendor,a.domainIds.map(i=>dom(i).name).join('/'),f2(r.bv),f2(r.th),Math.round(r.tco),f2(r.cs),f2(r.compBase),Math.round(r.redund*100),Math.round(r.redSpend),Math.round(r.redSpendAfter),f2(r.comp),r.disp,r.absorber?appName(r.absorber):'',r.disp==='Retain'?'BAU':r.size,Math.round(r.oneOffBase),Math.round(r.onboard),Math.round(r.oneOff),r.wave,r.start,r.end,Math.round(r.saving),aiOn()?'ON':'OFF',f2(r.ars),f2(r.aiMult),Math.round(r.aiAcc*100),r.durBase,r.dur,Math.round(M.base.R[a.id].oneOff),Math.round(r.aiOps)]);});download('dispositions.csv',rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv');},
  resetDemo:()=>askConfirm('Reset to demo data','Replace all current data with the synthetic demo data? Export JSON first if you want to keep your changes.','Reset',()=>{state=demoData();ui.howApp=null;ui.draft=null;commit();toast('Demo data restored.');}),
  resetParams:()=>askConfirm('Reset parameters','Reset all weights, thresholds and assumptions to defaults?','Reset',()=>{state.settings=JSON.parse(JSON.stringify(DEFAULT_SETTINGS));commit();toast('Parameters reset to defaults.');})
};
function download(name,content,type){const b=new Blob([content],{type});const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);}
document.addEventListener('click',e=>{
  if(e.target.id==='dlg'){closeDlg();return;}
  if(e.target.id==='modal'){closeModal();return;}
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.tagName==='A')e.preventDefault();
  const f=ACT[el.dataset.act];if(f)f(el.dataset,el,e);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('#dlg').classList.contains('hide'))closeDlg();else if(ui.modal)closeModal();else if(ui.draft)ACT.draftCancel();return;}
  if(e.key==='Enter'&&e.target.closest('#draftRow')&&e.target.tagName==='INPUT'){e.preventDefault();setDraft(e.target);ACT.draftSave();}
  if(e.key==='Tab'&&!e.ctrlKey&&!e.altKey&&e.target.matches('input[data-ch],select[data-ch],textarea[data-ch]')&&e.target.dataset.ch!=='draft'){
    // In score grids, Tab jumps only between score fields (skipping app-name links)
    const grid=e.target.closest('#scoreWrap,#aiWrap');
    const root=grid||e.target.closest('#mbody')||e.target.closest('#view');if(!root)return;
    const FOC=grid?'input[data-ch="score"]:not(:disabled)':'input:not([type="hidden"]):not(:disabled):not([tabindex="-1"]),select:not(:disabled),textarea:not(:disabled),button:not(:disabled),a[href],summary';
    const vis=x=>x.offsetParent!==null||x.getClientRects().length>0;
    const list=[...root.querySelectorAll(FOC)].filter(vis),idx=list.indexOf(e.target)+(e.shiftKey?-1:1),nx=list[idx];
    if(!nx)return;
    e.preventDefault();
    // Leaving the field triggers a re-render, so re-find the target afterwards (by its data attributes, else by position)
    let s=null;
    if(nx.dataset.ch)s=nx.tagName.toLowerCase()+(nx.type?`[type="${nx.type}"]`:'')+['ch','id','g','k','f','dom','i'].filter(a=>nx.dataset[a]!=null).map(a=>`[data-${a}="${CSS.escape(nx.dataset[a])}"]`).join('');
    e.target.blur();
    const r2=e.target.isConnected?root:(root.id?document.getElementById(root.id):root);
    const n=(s&&r2.querySelector(s))||[...r2.querySelectorAll(FOC)].filter(vis)[idx];
    if(n){n.focus();if(n.select&&/^(text|number|search|email|url|tel|)$/.test(n.type||''))n.select();}
  }
});
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-ch="draft"]');if(el)setDraft(el);
  // Keep a parameter's slider and number box in sync while dragging/typing (commit happens on change)
  const p=e.target.closest('.pc2 [data-ch="param"]');
  if(p)p.closest('.pc2').querySelectorAll('[data-ch="param"]').forEach(o=>{if(o!==p)o.value=p.value;});
});

/* ====================== CHANGE HANDLERS ====================== */
const CH={
  cap:el=>{const c=state.caps.find(x=>x.id===el.dataset.id);if(!c)return;c[el.dataset.f]=el.type==='checkbox'?el.checked:el.value;commit();},
  capsDom:el=>{ui.caps.dom=el.value;render();},
  capsQ:el=>{ui.caps.q=el.value;render(true);},
  mx:el=>{const k=el.dataset.k;ui.mx[k]=el.type==='checkbox'?el.checked:el.value;render(true);},
  dispoF:el=>{ui.dispo[el.dataset.k]=el.value;render(true);},
  howApp:el=>{ui.howApp=el.value;render(true);},
  param:el=>{
    let v;
    if(el.type==='checkbox')v=el.checked?1:0;
    else{const mn=parseFloat(el.min),mx=parseFloat(el.max);v=parseFloat(el.value);if(!isFinite(v))v=isFinite(mn)?mn:0;if(isFinite(mn))v=Math.max(mn,v);if(isFinite(mx))v=Math.min(mx,v);}
    state.settings[el.dataset.g][el.dataset.k]=v;commit();
  },
  score:el=>{const a=appById(el.dataset.id);if(!a)return;let v=parseFloat(el.value)||0;if(el.dataset.g!=='cost')v=Math.max(1,Math.min(5,Math.round(v)));else v=Math.max(0,v);if(el.dataset.g==='air'&&!a.air)a.air=aiDefault(a);a[el.dataset.g][el.dataset.k]=v;commit();},
  override:el=>{const a=appById(el.dataset.id);a.override=el.value;if(!REMOVED(el.value))a.overrideTarget='';commit();},
  overrideTarget:el=>{appById(el.dataset.id).overrideTarget=el.value;commit();},
  dom:el=>{const d=state.domains.find(x=>x.id===el.dataset.id);if(!d)return;d[el.dataset.f]=el.value;commit();},
  role:el=>{const r=role(el.dataset.id);if(!r)return;r[el.dataset.f]=el.value;commit();},
  app:el=>{const a=appById(el.dataset.id);if(!a)return;const f=el.dataset.f;a[f]=['interfaces','users','leadTime'].includes(f)?Math.max(0,parseFloat(el.value)||0):el.value;commit();},
  appDom:el=>{const a=appById(el.dataset.id);if(!a)return;const d=el.dataset.dom;if(el.checked){if(!a.domainIds.includes(d))a.domainIds.push(d);}else a.domainIds=a.domainIds.filter(x=>x!==d);commit();},
  appPrim:el=>{const a=appById(el.dataset.id);if(!a)return;a.domainIds=[el.value,...a.domainIds.filter(x=>x!==el.value)];commit();},
  importFile:el=>{const f=el.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{state=normalise(JSON.parse(rd.result));ui.howApp=null;ui.draft=null;commit();toast('Workbench data imported.');}catch(err){toast('Import failed: '+err.message,'err');}el.value='';};rd.readAsText(f);},
  draft:el=>setDraft(el),
  draftDom:el=>{const r=ui.draft&&ui.draft.rec;if(!r)return;const d=el.dataset.dom;r.domainIds=el.checked?[...new Set([...r.domainIds,d])]:r.domainIds.filter(x=>x!==d);delete ui.draft.err.domainIds;render(true);}
};
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(!el)return;const f=CH[el.dataset.ch];if(f)f(el);});

render();
</script>
</body>
