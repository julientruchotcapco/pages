<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Securitisation Ingestion System</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">
  <form id="login-form" class="card login-card">
    <div class="card-body">
      <div class="form-field">
        <label class="required" for="login-username">Username</label>
        <input id="login-username" name="username" type="text" autocomplete="username" value="Guest" disabled>
      </div>
      <div class="form-field">
        <label class="required" for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required autofocus>
      </div>
      <p id="login-error" class="login-error" role="alert" hidden></p>
      <button class="button button-primary" type="submit">Sign in</button>
    </div>
  </form>
  <script src="js/login.js"></script>
</body>
</html>
